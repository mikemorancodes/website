<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111211">
  <meta name="description" content="Mike Moran — Developer.">
  <title>Mike Moran — Developer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111211;
      color: #f4f3ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(92, 112, 94, 0.13), transparent 42%),
        #111211;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 50%;
      width: min(100% - 48px, 960px);
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid #292c29;
      transform: translateX(-50%);
    }

    .wordmark {
      color: #f4f3ef;
      font-size: 0.95rem;
      font-weight: 560;
      letter-spacing: -0.035em;
      text-decoration: none;
    }

    .wordmark span { color: #a9c5a5; }

    nav { display: flex; gap: 26px; }

    nav a {
      color: #a4aaa2;
      font-size: 0.9rem;
      text-decoration: none;
    }

    nav a:hover { color: #f4f3ef; }

    main {
      width: min(100% - 40px, 760px);
      padding: 48px 0;
      text-align: center;
      transform: translateY(-2vh);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.7rem);
      font-weight: 560;
      letter-spacing: -0.075em;
      line-height: 1.02;
    }

    .role {
      margin: 19px 0 0;
      color: #a4aaa2;
      font-size: clamp(1rem, 2.1vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.22em;
      margin-top: 54px;
      color: #d8e0d4;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: -0.12em;
      line-height: 1;
    }

    .mark span:first-child { color: #a9c5a5; }
    .mark span:last-child { color: #d8e0d4; }

    @media (max-width: 480px) {
      .topbar { width: min(100% - 36px, 960px); }
      nav { gap: 18px; }
      .mark { margin-top: 44px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">Mike Moran <span>{ }</span></a>
    <nav aria-label="Main navigation">
      <a href="/apps/support/">Support</a>
      <a href="/apps/privacy/">Privacy</a>
    </nav>
  </header>
  <main>
    <h1>Mike Moran</h1>
    <p class="role">Developer</p>
    <div class="mark" role="img" aria-label="Curly braces">
      <span aria-hidden="true">{</span><span aria-hidden="true">}</span>
    </div>
  </main>
</body>
</html>
