<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111211">
  <title>App Support — Mike Moran</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111211;
      color: #f4f3ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0, rgba(92, 112, 94, 0.12), transparent 38rem),
        #111211;
    }

    a { color: #c1d7b9; text-underline-offset: 0.2em; }
    a:hover { color: #e0edd9; }

    .topbar {
      width: min(100% - 48px, 960px);
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid #292c29;
    }

    .wordmark {
      color: #f4f3ef;
      font-size: 0.95rem;
      font-weight: 560;
      letter-spacing: -0.035em;
      text-decoration: none;
    }

    .wordmark span { color: #a9c5a5; }

    nav { display: flex; gap: 26px; }

    nav a {
      color: #a4aaa2;
      font-size: 0.9rem;
      text-decoration: none;
    }

    nav a:hover, nav a[aria-current="page"] { color: #f4f3ef; }

    main {
      width: min(100% - 48px, 960px);
      margin: 0 auto;
      padding: clamp(36px, 6vw, 56px) 0 88px;
    }

    .intro {
      max-width: 650px;
      margin: 22px 0 0;
      color: #a4aaa2;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    @media (max-width: 520px) {
      .topbar, main { width: min(100% - 36px, 960px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">Mike Moran <span>{ }</span></a>
    <nav aria-label="Main navigation">
      <a href="/apps/support/" aria-current="page">Support</a>
      <a href="/apps/privacy/">Privacy</a>
    </nav>
  </header>
  <main>
    <p class="intro">If you have any questions or suggestions about the apps, do not hesitate to contact us at <a href="mailto:support@mikemorancodes.com">support@mikemorancodes.com</a>.</p>
  </main>
</body>
</html>
